<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Congratulations — an animated celebration built with Cloudflare Pages." />
  <title>Congratulations, Jozefów!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>
  <canvas id="fireworks-canvas" aria-hidden="true"></canvas>

  <main class="stage">
    <section class="hero">
      <p class="kicker" id="kicker">supercooljozefow.pages.dev</p>
      <h1 class="title" id="title" aria-label="Congratulations">
        <!-- letters injected by js/text-reveal.js -->
      </h1>
      <p class="subtitle" id="subtitle">Jozefów, you absolutely nailed it.</p>
      <p class="lede" id="lede">
        Something amazing just happened. Take a moment. Soak it in.
        Then click anywhere to celebrate all over again.
      </p>

      <div class="cta-row">
        <button class="cta" id="replay-btn" type="button">
          <span class="cta__label">Celebrate again</span>
        </button>
        <a class="cta cta--ghost" href="https://pages.cloudflare.com" target="_blank" rel="noreferrer noopener">
          Built on Cloudflare Pages
        </a>
      </div>
    </section>

    <footer class="footer">
      <span>Hand-built with separate HTML, CSS &amp; JS files.</span>
      <span id="boot-time"></span>
    </footer>
  </main>

  <script src="/js/utils.js" defer></script>
  <script src="/js/confetti.js" defer></script>
  <script src="/js/fireworks.js" defer></script>
  <script src="/js/text-reveal.js" defer></script>
  <script src="/js/main.js" defer></script>
</body>
</html>
